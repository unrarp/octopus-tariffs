<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octopus Energy tariffs over time</title>
<link rel="preload" href="./vendor/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./vendor/fonts/newsreader-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
<!-- A theme picked with the button applies before first paint; app.js owns the button and the stored value. -->
<script>
try {
  const t = localStorage.getItem('octopus-tariffs:theme');
  if (t === 'light' || t === 'dark') document.documentElement.style.colorScheme = t;
} catch {}
</script>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div class="title-row">
      <h1>Octopus Energy tariffs over time</h1>
      <button id="theme" class="btn icon" type="button"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
      <button id="info" class="btn icon info" type="button" title="How to read this page" aria-label="How to read this page">i</button>
    </div>
    <p class="standfirst">What each Octopus tariff has charged, day by day, against the one you are on.</p>
  </header>

  <!-- On a phone the inputs fold behind this one-line summary of them. -->
  <button id="you-summary" class="you-summary" type="button" aria-expanded="false" aria-controls="you"><span id="you-summary-text"></span><span id="you-summary-act" class="act">Change</span></button>
  <section id="you" class="you" aria-label="Your region, usage and tariff">
    <div class="you-row">
      <label class="field">Region <select id="region"></select></label>
      <label class="field">Electricity <input id="kwh-electricity" type="number" min="0" step="100" inputmode="numeric"> kWh/yr</label>
      <label class="field">Gas <input id="kwh-gas" type="number" min="0" step="100" inputmode="numeric" placeholder="none"> kWh/yr</label>
    </div>
    <div class="you-row">
      <label class="field">I'm on <select id="mine"><option value="">no fixed contract (Flexible)</option></select></label>
      <label class="field">since <input id="since" type="date" disabled></label>
    </div>
    <p id="mine-line" class="hint mine-line" hidden></p>
  </section>

  <div class="controls">
    <fieldset id="window" class="seg" aria-label="Window">
      <button type="button" data-v="6" aria-pressed="false">6 months</button><button type="button" data-v="12" aria-pressed="true">1 year</button><button type="button" data-v="24" aria-pressed="false">2 years</button><button type="button" data-v="all" aria-pressed="false">All</button>
    </fieldset>
    <fieldset id="view" class="seg" aria-label="View">
      <button type="button" data-v="rates" aria-pressed="true">Rates</button><button type="button" data-v="annual" aria-pressed="false">Annual cost</button>
    </fieldset>
    <fieldset id="per" class="seg" aria-label="Per year or per month" hidden>
      <button type="button" data-v="year" aria-pressed="true">Per year</button><button type="button" data-v="month" aria-pressed="false">Per month</button>
    </fieldset>
  </div>
  <div class="legend">
    <div id="chips" class="chips"></div>
    <span id="legend-cap" class="legend-item"><span class="sw marker"></span><span id="cap-term"></span></span>
    <button id="chips-more" class="chips-more" type="button" aria-expanded="false" hidden></button>
  </div>

  <div id="chart-area">
    <p id="load-error" class="load-error" hidden></p>
    <div id="rates" class="grid">
      <div class="chart panel-chart"><h3 id="t-electricity-unit">Electricity unit rate p/kWh</h3><canvas id="c-electricity-unit"></canvas></div>
      <div class="chart panel-chart"><h3 id="t-electricity-standing">Electricity standing charge p/day</h3><canvas id="c-electricity-standing"></canvas></div>
      <div class="chart panel-chart"><h3 id="t-gas-unit">Gas unit rate p/kWh</h3><canvas id="c-gas-unit"></canvas></div>
      <div class="chart panel-chart"><h3 id="t-gas-standing">Gas standing charge p/day</h3><canvas id="c-gas-standing"></canvas></div>
    </div>
    <div id="annual" class="chart annual-chart" hidden><canvas id="c-annual"></canvas></div>
  </div>

  <section id="compare" class="compare" aria-labelledby="compare-title">
    <h2 id="compare-title">Compare tariffs</h2>
    <div class="compare-row">
      <select id="add" aria-label="Add a tariff"></select>
      <label class="field">from <input id="from" type="date"></label>
    </div>
    <div id="picked" class="chips compare-picked"></div>
    <p id="lead" class="lead"></p>
    <div class="controls">
      <fieldset id="cmode" class="seg" aria-label="Chart"><button type="button" data-v="paid" aria-pressed="false">£ paid</button><button type="button" data-v="vs" aria-pressed="true">vs yours</button><button type="button" data-v="switch" aria-pressed="false">if I switch</button></fieldset>
      <label class="field" id="switch-field" hidden>on <input id="switch" type="date"></label>
    </div>
    <div class="chart compare-chart"><canvas id="c-compare"></canvas></div>
    <ul id="totals" class="totals"></ul>
  </section>

  <footer class="footer"><p id="footer"></p><p id="csv"></p></footer>
</main>
<!-- Every definition the page uses: opened by the (i) button, by any term link (at its entry) and by a #fn-… deep link. -->
<dialog id="help" class="help" aria-labelledby="help-title">
  <div class="help-body">
    <div class="help-head">
      <h2 id="help-title">How to read this page</h2>
      <button id="help-close" class="btn" type="button">Close</button>
    </div>
    <dl id="defs"></dl>
  </div>
</dialog>
<script src="./vendor/chart.umd.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
